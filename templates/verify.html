{% extends "base.html" %}
{% block title %}Verify OTP · Cyber{% endblock %}
{% block body %}
<div class="page-wrap">
  <div class="card">
    <div class="card-title">
      <span class="emoji">🔐</span>
      VERIFY OTP
    </div>
    <p style="text-align:center;color:var(--muted);font-size:.85rem;margin-top:-14px;margin-bottom:20px;">
      Check your email for the 6-digit code
    </p>

    <form method="POST">
      <div class="field">
        <input name="otp" placeholder="6-digit OTP" maxlength="6"
               inputmode="numeric" pattern="[0-9]*" required
               style="letter-spacing:6px;text-align:center;font-size:1.3rem;">
      </div>
      <button class="btn" type="submit">VERIFY →</button>
    </form>

    {% if error %}<p class="err">⚠ {{ error }}</p>{% endif %}
    <div class="link-row"><a href="/login">← Back to Login</a></div>
  </div>
</div>
{% endblock %}
