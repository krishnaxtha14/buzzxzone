<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>⚡ {% block title %}Cyber{% endblock %}</title>
  <link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}">
  {% block extra_head %}{% endblock %}
</head>
<body>

  <!-- Global spark canvas (top layer, pointer-events:none) -->
  <canvas id="spark-canvas"></canvas>

  {% block body %}{% endblock %}

  <script>
  /* ══════════════════════════════════════════════════════════════
     CYBER · SPARK SYSTEM (all pages, all clicks/touches)
  ══════════════════════════════════════════════════════════════ */
  (function() {
    const sc  = document.getElementById('spark-canvas');
    const sCtx = sc.getContext('2d');
    const sparks = [];
    const SPARK_COLORS = ['#a855f7','#c084fc','#7c3aed','#e879f9','#ffffff','#d8b4fe'];

    function resizeSpark() { sc.width = innerWidth; sc.height = innerHeight; }
    resizeSpark();
    window.addEventListener('resize', resizeSpark);

    function spawnSparks(x, y, count) {
      count = count || 18;
      for (let i = 0; i < count; i++) {
        const angle = (Math.PI * 2 * i / count) + (Math.random() - 0.5) * 0.6;
        const speed = 2.5 + Math.random() * 5;
        sparks.push({
          x, y,
          vx: Math.cos(angle) * speed,
          vy: Math.sin(angle) * speed - 1.5,
          life: 1,
          decay: 0.035 + Math.random() * 0.045,
          size: 1.5 + Math.random() * 2.5,
          color: SPARK_COLORS[Math.floor(Math.random() * SPARK_COLORS.length)]
        });
      }
    }

    function animateSparks() {
      sCtx.clearRect(0, 0, sc.width, sc.height);
      for (let i = sparks.length - 1; i >= 0; i--) {
        const s = sparks[i];
        s.x  += s.vx;
        s.y  += s.vy;
        s.vy += 0.15;
        s.life -= s.decay;
        if (s.life <= 0) { sparks.splice(i, 1); continue; }

        sCtx.globalAlpha = s.life;

        /* Glowing dot */
        const grd = sCtx.createRadialGradient(s.x, s.y, 0, s.x, s.y, s.size * 2);
        grd.addColorStop(0, s.color);
        grd.addColorStop(1, 'transparent');
        sCtx.fillStyle = grd;
        sCtx.beginPath();
        sCtx.arc(s.x, s.y, s.size * s.life * 1.5, 0, Math.PI * 2);
        sCtx.fill();

        /* Trail */
        sCtx.strokeStyle = s.color;
        sCtx.lineWidth   = s.size * s.life * 0.7;
        sCtx.beginPath();
        sCtx.moveTo(s.x, s.y);
        sCtx.lineTo(s.x - s.vx * 3.5, s.y - s.vy * 3.5);
        sCtx.stroke();
      }
      sCtx.globalAlpha = 1;
      requestAnimationFrame(animateSparks);
    }
    animateSparks();

    document.addEventListener('mousedown', e => spawnSparks(e.clientX, e.clientY));
    document.addEventListener('touchstart', e => {
      Array.from(e.touches).forEach(t => spawnSparks(t.clientX, t.clientY));
    }, { passive: true });

    window._spawnSparks = spawnSparks;
  })();

  </script>

  {% block extra_scripts %}{% endblock %}
</body>
</html>
