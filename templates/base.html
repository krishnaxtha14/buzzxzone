<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>⚡ {% block title %}Cyber{% endblock %}</title>
  <link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}">
  {% block extra_head %}{% endblock %}
</head>
<body>

  <!-- Floating cyber background -->
  <div class="leaf-bg" id="leaf-bg"></div>

  <!-- Global spark canvas (top layer, pointer-events:none) -->
  <canvas id="spark-canvas"></canvas>

  <!-- Mute / music toggle -->
  <button id="mute-btn" title="Toggle music" onclick="toggleMute()">🔊</button>

  {% block body %}{% endblock %}

  <script>
  /* ══════════════════════════════════════════════════════════════
     CYBER · Floating background symbols
  ══════════════════════════════════════════════════════════════ */
  const CYBER_SYMBOLS = ['🌿','🍃','✨','🌱','⚡','💚','🌲','✦','🍀','🌾','💫','🌳','◆','🎋','✧'];
  const bg = document.getElementById('leaf-bg');
  for (let i = 0; i < 22; i++) {
    const el = document.createElement('span');
    el.className = 'leaf';
    el.textContent = CYBER_SYMBOLS[Math.floor(Math.random() * CYBER_SYMBOLS.length)];
    el.style.left              = Math.random() * 100 + 'vw';
    el.style.animationDuration = (14 + Math.random() * 20) + 's';
    el.style.animationDelay    = (-Math.random() * 22) + 's';
    el.style.fontSize          = (0.9 + Math.random() * 1.2) + 'rem';
    el.style.opacity           = '0';
    bg.appendChild(el);
  }

  /* ══════════════════════════════════════════════════════════════
     CYBER · SPARK SYSTEM (all pages, all clicks/touches)
  ══════════════════════════════════════════════════════════════ */
  (function() {
    const sc  = document.getElementById('spark-canvas');
    const sCtx = sc.getContext('2d');
    const sparks = [];
    const SPARK_COLORS = ['#22c55e','#86efac','#06b6d4','#fbbf24','#ffffff','#4ade80'];

    function resizeSpark() { sc.width = innerWidth; sc.height = innerHeight; }
    resizeSpark();
    window.addEventListener('resize', resizeSpark);

    function spawnSparks(x, y, count) {
      count = count || 18;
      for (let i = 0; i < count; i++) {
        const angle = (Math.PI * 2 * i / count) + (Math.random() - 0.5) * 0.6;
        const speed = 2.5 + Math.random() * 5;
        sparks.push({
          x, y,
          vx: Math.cos(angle) * speed,
          vy: Math.sin(angle) * speed - 1.5,
          life: 1,
          decay: 0.035 + Math.random() * 0.045,
          size: 1.5 + Math.random() * 2.5,
          color: SPARK_COLORS[Math.floor(Math.random() * SPARK_COLORS.length)]
        });
      }
    }

    function animateSparks() {
      sCtx.clearRect(0, 0, sc.width, sc.height);
      for (let i = sparks.length - 1; i >= 0; i--) {
        const s = sparks[i];
        s.x  += s.vx;
        s.y  += s.vy;
        s.vy += 0.15;
        s.life -= s.decay;
        if (s.life <= 0) { sparks.splice(i, 1); continue; }

        sCtx.globalAlpha = s.life;

        /* Glowing dot */
        const grd = sCtx.createRadialGradient(s.x, s.y, 0, s.x, s.y, s.size * 2);
        grd.addColorStop(0, s.color);
        grd.addColorStop(1, 'transparent');
        sCtx.fillStyle = grd;
        sCtx.beginPath();
        sCtx.arc(s.x, s.y, s.size * s.life * 1.5, 0, Math.PI * 2);
        sCtx.fill();

        /* Trail */
        sCtx.strokeStyle = s.color;
        sCtx.lineWidth   = s.size * s.life * 0.7;
        sCtx.beginPath();
        sCtx.moveTo(s.x, s.y);
        sCtx.lineTo(s.x - s.vx * 3.5, s.y - s.vy * 3.5);
        sCtx.stroke();
      }
      sCtx.globalAlpha = 1;
      requestAnimationFrame(animateSparks);
    }
    animateSparks();

    document.addEventListener('mousedown', e => spawnSparks(e.clientX, e.clientY));
    document.addEventListener('touchstart', e => {
      Array.from(e.touches).forEach(t => spawnSparks(t.clientX, t.clientY));
    }, { passive: true });

    window._spawnSparks = spawnSparks;
  })();

  /* ══════════════════════════════════════════════════════════════
     CYBER · NEON MOUSE TRAIL
  ══════════════════════════════════════════════════════════════ */
  (function() {
    const canvas = document.getElementById('spark-canvas'); // reuse existing canvas
    const ctx    = canvas.getContext('2d');

    const TRAIL_COLORS = [
      '#22c55e', '#4ade80', '#86efac',
      '#06b6d4', '#38bdf8', '#fbbf24',
      '#a3e635', '#34d399'
    ];

    const trail     = [];
    const MAX_TRAIL = 38;
    let   mouseX    = -999, mouseY = -999;
    let   lastX     = -999, lastY  = -999;
    let   colorIdx  = 0;
    let   colorTick = 0;

    // Track mouse position
    document.addEventListener('mousemove', e => {
      mouseX = e.clientX;
      mouseY = e.clientY;
    }, { passive: true });

    document.addEventListener('touchmove', e => {
      const t = e.touches[0];
      mouseX = t.clientX;
      mouseY = t.clientY;
    }, { passive: true });

    function addTrailPoint(x, y) {
      if (Math.abs(x - lastX) < 2 && Math.abs(y - lastY) < 2) return;
      lastX = x; lastY = y;
      colorTick++;
      if (colorTick % 3 === 0) colorIdx = (colorIdx + 1) % TRAIL_COLORS.length;

      trail.push({
        x, y,
        color:  TRAIL_COLORS[colorIdx],
        life:   1.0,
        size:   4 + Math.random() * 3,
        vx:     (Math.random() - 0.5) * 0.8,
        vy:     (Math.random() - 0.5) * 0.8,
      });
      if (trail.length > MAX_TRAIL) trail.shift();
    }

    function drawTrail() {
      // Draw each trail particle (layered on top of spark canvas each frame)
      for (let i = trail.length - 1; i >= 0; i--) {
        const p = trail[i];
        p.life -= 0.045;
        p.x    += p.vx;
        p.y    += p.vy;
        if (p.life <= 0) { trail.splice(i, 1); continue; }

        const alpha = p.life;
        const size  = p.size * p.life;

        // Outer glow
        const grad = ctx.createRadialGradient(p.x, p.y, 0, p.x, p.y, size * 3.5);
        grad.addColorStop(0, p.color + 'cc');
        grad.addColorStop(0.4, p.color + '55');
        grad.addColorStop(1, 'transparent');
        ctx.globalAlpha = alpha * 0.6;
        ctx.fillStyle   = grad;
        ctx.beginPath();
        ctx.arc(p.x, p.y, size * 3.5, 0, Math.PI * 2);
        ctx.fill();

        // Inner bright core
        ctx.globalAlpha = alpha;
        ctx.fillStyle   = '#ffffff';
        ctx.beginPath();
        ctx.arc(p.x, p.y, size * 0.4, 0, Math.PI * 2);
        ctx.fill();

        // Colored ring
        ctx.globalAlpha = alpha * 0.9;
        ctx.strokeStyle = p.color;
        ctx.lineWidth   = 1.2;
        ctx.beginPath();
        ctx.arc(p.x, p.y, size * 1.1, 0, Math.PI * 2);
        ctx.stroke();
      }
      ctx.globalAlpha = 1;
    }

    // Connect trail points with a glowing line
    function drawTrailLine() {
      if (trail.length < 2) return;
      ctx.save();
      ctx.lineCap    = 'round';
      ctx.lineJoin   = 'round';
      for (let i = 1; i < trail.length; i++) {
        const a = trail[i - 1];
        const b = trail[i];
        const t = i / trail.length;
        ctx.globalAlpha = t * 0.45 * b.life;
        ctx.strokeStyle = b.color;
        ctx.lineWidth   = b.size * t * 0.9;
        ctx.shadowBlur  = 8;
        ctx.shadowColor = b.color;
        ctx.beginPath();
        ctx.moveTo(a.x, a.y);
        ctx.lineTo(b.x, b.y);
        ctx.stroke();
      }
      ctx.shadowBlur  = 0;
      ctx.globalAlpha = 1;
      ctx.restore();
    }

    // Custom cursor dot
    function drawCursor() {
      if (mouseX < 0) return;
      const t = Date.now() * 0.003;
      const r = 7 + Math.sin(t * 3) * 2;
      const col = TRAIL_COLORS[colorIdx];

      // Outer pulse ring
      ctx.globalAlpha = 0.35 + Math.sin(t * 4) * 0.15;
      ctx.strokeStyle = col;
      ctx.lineWidth   = 1.5;
      ctx.shadowBlur  = 12;
      ctx.shadowColor = col;
      ctx.beginPath();
      ctx.arc(mouseX, mouseY, r + 4, 0, Math.PI * 2);
      ctx.stroke();

      // Inner dot
      ctx.globalAlpha = 0.9;
      ctx.fillStyle   = '#ffffff';
      ctx.shadowBlur  = 6;
      ctx.beginPath();
      ctx.arc(mouseX, mouseY, 2.5, 0, Math.PI * 2);
      ctx.fill();

      ctx.shadowBlur  = 0;
      ctx.globalAlpha = 1;
    }

    // Hook into the existing spark animation loop via a separate rAF
    let lastFrame = 0;
    function trailLoop(ts) {
      requestAnimationFrame(trailLoop);
      // Throttle to ~60fps
      if (ts - lastFrame < 14) return;
      lastFrame = ts;

      addTrailPoint(mouseX, mouseY);
      drawTrailLine();
      drawTrail();
      drawCursor();
    }
    requestAnimationFrame(trailLoop);
  })();

  /* ══════════════════════════════════════════════════════════════
     CYBER · AUDIO ENGINE (ambient music + click sounds)
  ══════════════════════════════════════════════════════════════ */
  (function() {
    let ctx = null, masterGain = null, muted = false, started = false;
    let melodyTimer = null, bassTimer = null, padNodes = [];

    /* G-major pentatonic — bright, nature-inspired */
    const MELODY = [392, 440, 523.3, 587.3, 659.3, 783.9, 659.3, 587.3,
                    523.3, 440, 392, 523.3, 440, 659.3, 523.3, 587.3];
    const BASS   = [98, 110, 130.8, 146.8, 98, 130.8, 110, 146.8];
    let mIdx = 0, bIdx = 0;

    function initCtx() {
      if (ctx) return;
      ctx = new (window.AudioContext || window.webkitAudioContext)();
      masterGain = ctx.createGain();
      masterGain.gain.value = 0.45;
      masterGain.connect(ctx.destination);
    }

    function startAmbient() {
      if (started || muted) return;
      started = true;

      /* ── Pad / drone layer ── */
      [130.8, 155.6, 196].forEach((freq, i) => {
        const osc  = ctx.createOscillator();
        const lfo  = ctx.createOscillator();
        const lfoG = ctx.createGain();
        const g    = ctx.createGain();
        lfo.frequency.value = 0.25 + i * 0.08;
        lfoG.gain.value = 1.5;
        lfo.connect(lfoG); lfoG.connect(osc.frequency);
        osc.type = 'sine';
        osc.frequency.value = freq;
        osc.connect(g); g.connect(masterGain);
        g.gain.setValueAtTime(0, ctx.currentTime);
        g.gain.linearRampToValueAtTime(0.035, ctx.currentTime + 3);
        lfo.start(); osc.start();
        padNodes.push(osc, lfo);
      });

      /* ── Melody arpeggio ── */
      melodyTimer = setInterval(() => {
        if (muted || !ctx) return;
        const t   = ctx.currentTime;
        const osc = ctx.createOscillator();
        const g   = ctx.createGain();
        osc.connect(g); g.connect(masterGain);
        osc.type = 'triangle';
        osc.frequency.value = MELODY[mIdx % MELODY.length];
        g.gain.setValueAtTime(0, t);
        g.gain.linearRampToValueAtTime(0.12, t + 0.04);
        g.gain.linearRampToValueAtTime(0, t + 0.5);
        osc.start(t); osc.stop(t + 0.55);
        mIdx++;
      }, 320);

      /* ── Bass pulse ── */
      bassTimer = setInterval(() => {
        if (muted || !ctx) return;
        const t   = ctx.currentTime;
        const osc = ctx.createOscillator();
        const g   = ctx.createGain();
        osc.connect(g); g.connect(masterGain);
        osc.type = 'sine';
        osc.frequency.value = BASS[bIdx % BASS.length];
        g.gain.setValueAtTime(0, t);
        g.gain.linearRampToValueAtTime(0.28, t + 0.04);
        g.gain.linearRampToValueAtTime(0, t + 1.1);
        osc.start(t); osc.stop(t + 1.2);
        bIdx++;
      }, 640);
    }

    /* Crisp nature click: a short woody "tock" */
    function playClick() {
      if (!ctx || muted) return;
      const t = ctx.currentTime;
      // High tick
      const o1 = ctx.createOscillator(); const g1 = ctx.createGain();
      o1.type = 'triangle'; o1.frequency.value = 880;
      o1.connect(g1); g1.connect(masterGain);
      g1.gain.setValueAtTime(0.18, t);
      g1.gain.exponentialRampToValueAtTime(0.001, t + 0.06);
      o1.start(t); o1.stop(t + 0.07);
      // Low woody thud
      const o2 = ctx.createOscillator(); const g2 = ctx.createGain();
      o2.type = 'sine'; o2.frequency.setValueAtTime(260, t + 0.01);
      o2.frequency.exponentialRampToValueAtTime(120, t + 0.05);
      o2.connect(g2); g2.connect(masterGain);
      g2.gain.setValueAtTime(0.14, t + 0.01);
      g2.gain.exponentialRampToValueAtTime(0.001, t + 0.08);
      o2.start(t + 0.01); o2.stop(t + 0.1);
    }

    /* Correct-answer chime (ascending) */
    window.playCorrectSound = function() {
      if (!ctx || muted) return;
      [523, 659, 784].forEach((freq, i) => {
        const t   = ctx.currentTime + i * 0.1;
        const osc = ctx.createOscillator();
        const g   = ctx.createGain();
        osc.connect(g); g.connect(masterGain);
        osc.type = 'triangle';
        osc.frequency.value = freq;
        g.gain.setValueAtTime(0, t);
        g.gain.linearRampToValueAtTime(0.2, t + 0.04);
        g.gain.linearRampToValueAtTime(0, t + 0.25);
        osc.start(t); osc.stop(t + 0.3);
      });
    };

    /* Wrong-answer buzz (descending) */
    window.playWrongSound = function() {
      if (!ctx || muted) return;
      [300, 220].forEach((freq, i) => {
        const t   = ctx.currentTime + i * 0.12;
        const osc = ctx.createOscillator();
        const g   = ctx.createGain();
        osc.connect(g); g.connect(masterGain);
        osc.type = 'sawtooth';
        osc.frequency.value = freq;
        g.gain.setValueAtTime(0, t);
        g.gain.linearRampToValueAtTime(0.14, t + 0.03);
        g.gain.linearRampToValueAtTime(0, t + 0.22);
        osc.start(t); osc.stop(t + 0.25);
      });
    };

    /* Mute toggle */
    window.toggleMute = function() {
      muted = !muted;
      const btn = document.getElementById('mute-btn');
      btn.textContent = muted ? '🔇' : '🔊';
      if (masterGain) {
        masterGain.gain.setTargetAtTime(muted ? 0 : 0.45, ctx.currentTime, 0.15);
      }
    };

    /* Start everything on first interaction */
    function onFirstInteraction() {
      initCtx();
      if (ctx.state === 'suspended') ctx.resume();
      startAmbient();
      playClick();
    }

    let audioReady = false;
    document.addEventListener('mousedown', () => {
      if (!audioReady) { audioReady = true; onFirstInteraction(); return; }
      initCtx();
      playClick();
    });
    document.addEventListener('touchstart', () => {
      if (!audioReady) { audioReady = true; onFirstInteraction(); return; }
      initCtx();
      playClick();
    }, { passive: true });
  })();
  </script>

  {% block extra_scripts %}{% endblock %}
</body>
</html>
