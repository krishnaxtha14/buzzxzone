{% extends "base.html" %}
{% block title %}Login · Cyber{% endblock %}

{% block body %}
<div class="page-wrap">

  <!-- Interactive dot field (subtle grey, no colour wash / silk texture) -->
  <canvas id="dot-field" style="position:fixed;inset:0;width:100%;height:100%;z-index:1;pointer-events:none;"></canvas>

  <div class="card" style="z-index:3">

    <!-- Animated logo (green-screen video, keyed live onto a transparent canvas) -->
    <a href="/" class="brand-logo-link" aria-label="BuzzXzone home">
      <video id="logo-video" src="{{ url_for('static', filename='logo.mp4') }}"
             autoplay loop muted playsinline
             style="position:absolute; width:1px; height:1px; opacity:0.01; pointer-events:none;"></video>
      <canvas id="logo-canvas" width="90" height="90" class="cyber-hero-logo brand-logo"></canvas>
    </a>

    <a href="/" aria-label="BuzzXzone home" style="display:block; margin: 4px auto 4px;">
      <video id="wordmark-video" src="{{ url_for('static', filename='wordmark.mp4') }}"
             autoplay loop muted playsinline
             style="position:absolute; width:1px; height:1px; opacity:0.01; pointer-events:none;"></video>
      <canvas id="wordmark-canvas" width="260" height="81" class="brand-wordmark"></canvas>
    </a>

    <form method="POST">
      <div class="field">
        <input name="email" type="email" placeholder="Email Address" value="{{ email or '' }}" required>
      </div>
      <div class="field">
        <input name="password" type="password" placeholder="Password" required>
      </div>
      <button class="btn" type="submit">LOG IN →</button>
    </form>

    {% if error %}
      <p class="err">⚠ {{ error }}</p>
    {% endif %}

    <div class="link-row" style="display:flex;justify-content:space-between;margin-top:18px;">
      <a href="/register">New Player? Register</a>
      <a href="/forgot">Forgot Password</a>
    </div>
  </div>
</div>
{% endblock %}

{% block extra_scripts %}
<script src="{{ url_for('static', filename='effects.js') }}"></script>
<script>
  initChromaVideo(document.getElementById('logo-video'), document.getElementById('logo-canvas'));
  initChromaVideo(document.getElementById('wordmark-video'), document.getElementById('wordmark-canvas'),
    { width: 260, height: 81 });
</script>
{% endblock %}
