{% extends "base.html" %}
{% block title %}Login · Cyber{% endblock %}

{% block body %}
<div class="page-wrap">

  <!-- Purple particle network canvas -->
  <canvas id="particles" style="position:fixed;inset:0;z-index:1;pointer-events:none;"></canvas>

  <div class="card" style="z-index:3">

    <!-- SVG Logo -->
    <img src="{{ url_for('static', filename='logo.svg') }}"
         width="80" height="80" alt="Cyber Logo"
         class="cyber-hero-logo">

    <div class="card-title" style="margin-bottom:4px;">CYBER</div>

    <p class="login-subtitle">LEARNING QUIZ HUB</p>

    <form method="POST">
      <div class="field">
        <input name="email" type="email" placeholder="Email Address" required>
      </div>
      <div class="field">
        <input name="password" type="password" placeholder="Password" required>
      </div>
      <button class="btn" type="submit">ENTER THE ARENA →</button>
    </form>

    {% if error %}
      <p class="err">⚠ {{ error }}</p>
    {% endif %}

    <div class="link-row" style="display:flex;justify-content:space-between;margin-top:18px;">
      <a href="/register">New Player? Register</a>
      <a href="/forgot">Forgot Password</a>
    </div>
  </div>
</div>
{% endblock %}

{% block extra_scripts %}
<script>
/* ── Purple particle network ── */
(function(){
  const c   = document.getElementById('particles');
  const ctx = c.getContext('2d');
  c.width   = innerWidth;
  c.height  = innerHeight;
  window.addEventListener('resize', () => { c.width = innerWidth; c.height = innerHeight; });

  const pts = Array.from({length: 80}, () => ({
    x:  Math.random() * innerWidth,
    y:  Math.random() * innerHeight,
    r:  Math.random() * 1.6 + 0.5,
    vx: (Math.random() - 0.5) * 0.4,
    vy: (Math.random() - 0.5) * 0.4,
    a:  Math.random() * 0.2 + 0.05,
    hue: Math.floor(Math.random() * 60 + 260) /* 260-320: purple-pink range */
  }));

  /* On click/touch, repel particles */
  let mouse = { x: -999, y: -999 };
  document.addEventListener('mousemove', e => { mouse.x = e.clientX; mouse.y = e.clientY; });

  function draw() {
    ctx.clearRect(0, 0, c.width, c.height);
    pts.forEach(p => {
      /* Gentle repel from cursor */
      const dx = p.x - mouse.x, dy = p.y - mouse.y;
      const dist = Math.sqrt(dx*dx + dy*dy);
      if (dist < 80) {
        p.vx += dx / dist * 0.08;
        p.vy += dy / dist * 0.08;
      }
      /* Damping + wrap */
      p.vx *= 0.99; p.vy *= 0.99;
      p.x += p.vx; p.y += p.vy;
      if (p.x < 0) p.x = c.width;  if (p.x > c.width)  p.x = 0;
      if (p.y < 0) p.y = c.height; if (p.y > c.height) p.y = 0;

      /* Pulsing glow dot */
      const grd = ctx.createRadialGradient(p.x, p.y, 0, p.x, p.y, p.r * 4);
      grd.addColorStop(0, `hsla(${p.hue},85%,65%,${p.a * 2})`);
      grd.addColorStop(1, `hsla(${p.hue},85%,65%,0)`);
      ctx.fillStyle = grd;
      ctx.beginPath();
      ctx.arc(p.x, p.y, p.r * 4, 0, Math.PI * 2);
      ctx.fill();
    });

    /* Connection lines */
    for (let i = 0; i < pts.length; i++) {
      for (let j = i + 1; j < pts.length; j++) {
        const dx = pts[i].x - pts[j].x, dy = pts[i].y - pts[j].y;
        const d  = Math.sqrt(dx*dx + dy*dy);
        if (d < 110) {
          const alpha = (1 - d / 110) * 0.18;
          ctx.beginPath();
          ctx.moveTo(pts[i].x, pts[i].y);
          ctx.lineTo(pts[j].x, pts[j].y);
          ctx.strokeStyle = `rgba(168,85,247,${alpha})`;
          ctx.lineWidth = 0.8;
          ctx.stroke();
        }
      }
    }
    requestAnimationFrame(draw);
  }
  draw();
})();
</script>
{% endblock %}
