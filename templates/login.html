{% extends "base.html" %}
{% block title %}Login · Cyber{% endblock %}

{% block body %}
<div class="page-wrap">

  <div class="card" style="z-index:3">

    <!-- Static logo (pre-keyed transparent PNG — no live video/canvas processing) -->
    <a href="/" class="brand-logo-link" aria-label="BuzzXzone home">
      <img src="{{ url_for('static', filename='logo.png') }}" width="90" height="90"
           class="cyber-hero-logo brand-logo" alt="BuzzXzone logo">
    </a>

    <a href="/" aria-label="BuzzXzone home" style="display:block; margin: 4px auto 4px;">
      <img src="{{ url_for('static', filename='wordmark.png') }}" width="340" height="106"
           class="brand-wordmark" alt="BuzzXzone">
    </a>

    <form method="POST">
      <div class="field">
        <input name="email" type="email" placeholder="Email Address" value="{{ email or '' }}" required>
      </div>
      <div class="field">
        <input name="password" type="password" placeholder="Password" required>
      </div>
      <button class="btn" type="submit">LOG IN →</button>
    </form>

    {% if error %}
      <p class="err">⚠ {{ error }}</p>
    {% endif %}

    <div class="link-row" style="display:flex;justify-content:space-between;margin-top:18px;">
      <a href="/register">New Player? Register</a>
      <a href="/forgot">Forgot Password</a>
    </div>
  </div>
</div>
{% endblock %}
