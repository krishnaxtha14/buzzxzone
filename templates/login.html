{% extends "base.html" %}
{% block title %}Login · Cyber{% endblock %}

{% block body %}
<div class="page-wrap">

  <!-- Background effects: silk texture base + soft flowing colour wash + interactive dot field -->
  <canvas id="silk-bg"     style="position:fixed;inset:0;z-index:0;pointer-events:none;"></canvas>
  <canvas id="color-bends" style="position:fixed;inset:0;z-index:1;pointer-events:none;"></canvas>
  <canvas id="dot-field"   style="position:fixed;inset:0;z-index:2;"></canvas>

  <div class="card" style="z-index:3">

    <!-- Animated logo (green-screen video, keyed live onto a transparent canvas) -->
    <a href="/" class="brand-logo-link" aria-label="BuzzXzone home">
      <video id="logo-video" src="{{ url_for('static', filename='logo.mp4') }}"
             autoplay loop muted playsinline style="display:none"></video>
      <canvas id="logo-canvas" width="90" height="90" class="cyber-hero-logo brand-logo"></canvas>
    </a>

    <a href="/" aria-label="BuzzXzone home" style="display:block; margin: 4px auto 4px;">
      <video id="wordmark-video" src="{{ url_for('static', filename='wordmark.mp4') }}"
             autoplay loop muted playsinline style="display:none"></video>
      <canvas id="wordmark-canvas" width="260" height="81" class="brand-wordmark"></canvas>
    </a>

    <form method="POST">
      <div class="field">
        <input name="email" type="email" placeholder="Email Address" value="{{ email or '' }}" required>
      </div>
      <div class="field">
        <input name="password" type="password" placeholder="Password" required>
      </div>
      <button class="btn" type="submit">LOG IN →</button>
    </form>

    {% if error %}
      <p class="err">⚠ {{ error }}</p>
    {% endif %}

    <div class="link-row" style="display:flex;justify-content:space-between;margin-top:18px;">
      <a href="/register">New Player? Register</a>
      <a href="/forgot">Forgot Password</a>
    </div>
  </div>
</div>
{% endblock %}

{% block extra_scripts %}
<script src="{{ url_for('static', filename='effects.js') }}"></script>
<script>
  initSilk(document.getElementById('silk-bg'), {
    color: '#3d2f52', speed: 5, scale: 1, noiseIntensity: 1.5, rotation: 0,
  });
  initColorBends(document.getElementById('color-bends'), {
    color: '#A855F7', speed: 0.2, frequency: 1.0, noise: 0.15,
    bandWidth: 0.14, rotation: 90, fadeTop: 0.75, iterations: 1, intensity: 1.3,
  });
  initDotField(document.getElementById('dot-field'), {
    dotRadius: 1.5, dotSpacing: 14, cursorRadius: 500, cursorForce: 0.10,
    bulgeOnly: true, bulgeStrength: 67, glowRadius: 160, sparkle: false, waveAmplitude: 0,
  });
  initChromaVideo(document.getElementById('logo-video'), document.getElementById('logo-canvas'));
  initChromaVideo(document.getElementById('wordmark-video'), document.getElementById('wordmark-canvas'),
    { width: 260, height: 81 });
</script>
{% endblock %}
